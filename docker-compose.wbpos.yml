# WBPOS local Docker stack
# Usage:
#   copy .env.docker.example to .env.docker   (first time only)
#   docker compose -f docker-compose.wbpos.yml up -d --build
#   open http://localhost:8080

volumes:
  wbpos_mysql_data:
    driver: local
  wbpos_uploads:
    driver: local
  wbpos_logs:
    driver: local

networks:
  wbpos_net:

services:
  mysql:
    image: mariadb:10.5
    container_name: wbpos-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    networks:
      - wbpos_net
    volumes:
      - wbpos_mysql_data:/var/lib/mysql
      - ./app/Database/wbpos.sql:/docker-entrypoint-initdb.d/01-wbpos.sql:ro
      - ./app/Database/docker/02-tenant-grants.sql:/docker-entrypoint-initdb.d/02-tenant-grants.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: wbpos_root
      MYSQL_DATABASE: wbpos
      MYSQL_USER: wbpos
      MYSQL_PASSWORD: wbpos123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwbpos", "-pwbpos123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wbpos:
    build:
      context: .
      target: wbpos
    image: wbpos:latest
    container_name: wbpos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - wbpos_net
    volumes:
      - ./.env.docker:/app/.env:ro
      - ./app:/app/app
      - ./public/css:/app/public/css:ro
      - ./public/js:/app/public/js:ro
      - ./public/images:/app/public/images:ro
      - ./public/resources:/app/public/resources:ro
      - wbpos_uploads:/app/public/uploads
      - wbpos_logs:/app/writable/logs
      - ./writable/cache:/app/writable/cache
      - ./writable/mail_outbox:/app/writable/mail_outbox
    environment:
      CI_ENVIRONMENT: development
      MYSQL_HOST_NAME: mysql
      MYSQL_USERNAME: wbpos
      MYSQL_PASSWORD: wbpos123
      MYSQL_DB_NAME: wbpos
      PHP_TIMEZONE: Asia/Phnom_Penh

  mailhog:
    image: mailhog/mailhog:latest
    container_name: wbpos-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wbpos_net
